name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run apps/okf-graph/dist/index.js --help

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cp README.md apps/okf-graph/README.md
      - uses: changesets/action@v2.1.1
        with:
          version-script: bunx changeset version
          publish-script: bunx changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
